<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
<title>CV · Pranjal Singh Sesodia</title>
<meta name="description" content="CV of Pranjal Singh Sesodia, mechanical engineering undergraduate at NSUT, New Delhi.">
<meta name="theme-color" content="#f1efea">
<link rel="canonical" href="https://pranjalsinghsesodia.github.io/cv.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&amp;family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;display=swap">
<link rel="stylesheet" href="css/site.css?v=20261108">
<style>
  /* the CV is drawn into the page from cv.pdf, so the browser shows it instead of saving it */
  body { cursor: auto; }
  .cv { max-width: 920px; margin: 0 auto; padding: 28px 18px 72px; }
  .cv-bar { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .8rem 1.4rem; margin-bottom: 1.6rem; }
  .cv-bar h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 300; letter-spacing: -.015em; margin: .4rem 0 0; line-height: 1.1; }
  .cv-bar .links { margin: 0; }
  .sheet { position: relative; background: #fff; box-shadow: 0 1px 2px rgba(40, 34, 24, .08), 0 8px 28px rgba(40, 34, 24, .08); margin: 0 0 22px; }
  .sheet canvas { display: block; width: 100%; height: auto; }
  .sheet a { position: absolute; display: block; }
  .sheet a:focus-visible { outline: 2px solid var(--felt); }
  .cv-msg { color: var(--ink-2); }
</style>
</head>
<body>
<main class="cv">
  <div class="cv-bar">
    <div>
      <p class="crumb" style="margin:0"><a href="index.html">&larr; Pranjal Singh Sesodia</a></p>
      <h1>Curriculum vitae</h1>
    </div>
    <ul class="links">
      <li><a href="cv.pdf" download="Pranjal_Singh_Sesodia_CV.pdf">Download PDF</a></li>
      <li><a href="mailto:pranjalsinghsesodia@gmail.com">Email</a></li>
    </ul>
  </div>
  <div id="pages" aria-live="polite"><p class="cv-msg small">Loading the CV…</p></div>
  <noscript><p class="cv-msg">This page draws the CV with JavaScript. <a href="cv.pdf">Open the PDF</a> instead.</p></noscript>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(() => {
  const box = document.getElementById('pages');
  const fail = () => { box.innerHTML = '<p class="cv-msg">The CV couldn’t be shown here. <a href="cv.pdf">Open the PDF</a> instead.</p>'; };
  if (!window.pdfjsLib) return fail();
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  let pdf = null, width = 0;

  // each page drawn at the screen's real resolution, with the PDF's own links laid over it
  async function draw() {
    const w = box.clientWidth;
    if (!pdf || Math.abs(w - width) < 2) return;
    width = w;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const out = document.createDocumentFragment();
    for (let n = 1; n <= pdf.numPages; n++) {
      const page = await pdf.getPage(n);
      const base = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: (w / base.width) * dpr });
      const sheet = document.createElement('div');
      sheet.className = 'sheet';
      const cv = document.createElement('canvas');
      cv.width = Math.floor(vp.width);
      cv.height = Math.floor(vp.height);
      cv.setAttribute('role', 'img');
      cv.setAttribute('aria-label', `CV, page ${n} of ${pdf.numPages}`);
      sheet.appendChild(cv);
      // 'print' draws in one pass without waiting for animation frames, so a CV opened in a background tab is ready when you switch to it
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp, intent: 'print' }).promise;
      const css = page.getViewport({ scale: w / base.width });
      for (const a of await page.getAnnotations()) {
        if (a.subtype !== 'Link' || !a.url) continue;
        const [x1, y1, x2, y2] = css.convertToViewportRectangle(a.rect);
        const link = document.createElement('a');
        link.href = a.url;
        if (!/^mailto:/i.test(a.url)) { link.target = '_blank'; link.rel = 'noopener'; }
        link.setAttribute('aria-label', a.url.replace(/^mailto:/i, ''));
        Object.assign(link.style, { left: Math.min(x1, x2) + 'px', top: Math.min(y1, y2) + 'px', width: Math.abs(x2 - x1) + 'px', height: Math.abs(y2 - y1) + 'px' });
        sheet.appendChild(link);
      }
      out.appendChild(sheet);
    }
    box.replaceChildren(out);
  }

  pdfjsLib.getDocument('cv.pdf').promise.then((doc) => { pdf = doc; return draw(); }).catch(fail);
  let t = 0;
  addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 200); });
})();
</script>
</body>
</html>
