name: Deploy site

on:
  push:
    branches: [main]
  # sent by a project repo when its portfolio/ folder changes (templates/project-repo)
  repository_dispatch:
    types: [project-updated]
  workflow_dispatch:
  # daily rebuild at 06:00 IST, so project changes land even without a ping
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pull project data from project repos
        run: node scripts/sync-projects.mjs
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_READ_TOKEN }}

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
