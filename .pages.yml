# Pages CMS (https://pagescms.org): sign in with GitHub, open this repo,
# and add stories or journal entries from your phone. Saving commits to main,
# which redeploys the site in about two minutes.

media:
  - name: stories
    label: Story photos
    input: src/assets/stories
    output: ../../assets/stories
    categories: [image]
  - name: films
    label: Film posters
    input: src/assets/films
    output: ../../assets/films
    categories: [image]

content:
  - name: stories
    label: Stories
    type: collection
    path: src/content/stories
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      fields: [image, caption, highlight]
      primary: caption
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: image
        label: Photo
        type: image
        required: true
        options:
          media: stories
      - name: caption
        label: Caption
        type: string
        required: true
      - name: highlight
        label: Set (Lab, Baja, ...)
        type: select
        required: true
        options:
          values: [Lab, Baja, Side builds]
          creatable: true
      - name: date
        label: Date (optional)
        type: date
      - name: order
        label: Order (optional, lower comes first)
        type: number
      - name: location
        label: Location
        type: string
      - name: video
        label: Clip file name in src/assets/stories (optional, e.g. 2026-10-clip.mp4)
        type: string
      - name: pick
        label: My pick (circled on the contact sheet)
        type: boolean
        default: false

  - name: journal
    label: Journal
    type: collection
    path: src/content/journal
    filename: '{primary}.md'
    view:
      fields: [title, date, draft]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: summary
        label: One-line summary
        type: string
        required: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft (hidden from the live site)
        type: boolean
        default: true
      - name: body
        label: Entry
        type: rich-text

  - name: films
    label: Films
    type: collection
    path: src/content/films
    filename: '{primary}.md'
    view:
      fields: [poster, title, date]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: poster
        label: Poster frame
        type: image
        required: true
        options:
          media: films
      - name: link
        label: Where it plays (YouTube, Vimeo or Instagram link)
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: role
        label: Your role (e.g. Shot and edited)
        type: string
      - name: duration
        label: Length (e.g. 2:40)
        type: string
      - name: order
        label: Order (lower comes first)
        type: number
        default: 100
