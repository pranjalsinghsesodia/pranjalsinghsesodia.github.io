<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Source for diagram.png. After editing, re-render with:
       node -e "require('sharp')('diagram.source.svg',{density:144}).resize(1600,900).png().toFile('diagram.png')" -->
  <rect width="1600" height="900" fill="#0f1113"/>
  <g stroke="#1a1d20" stroke-width="1">
    <path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600M0 500H1600M0 600H1600M0 700H1600M0 800H1600"/>
    <path d="M100 0V900M200 0V900M300 0V900M400 0V900M500 0V900M600 0V900M700 0V900M800 0V900M900 0V900M1000 0V900M1100 0V900M1200 0V900M1300 0V900M1400 0V900M1500 0V900"/>
  </g>

  <!-- rays from each camera centre to the keypoint P -->
  <g stroke="#8c9fff" stroke-width="3" stroke-linecap="round">
    <line x1="520" y1="700" x2="830" y2="250"/>
    <line x1="1080" y1="700" x2="830" y2="250"/>
  </g>
  <g stroke="#8c9fff" stroke-width="2" stroke-dasharray="10 10" opacity="0.45">
    <line x1="520" y1="700" x2="520" y2="250"/>
    <line x1="1080" y1="700" x2="1080" y2="250"/>
  </g>

  <!-- image planes with projected points -->
  <g stroke="#e8e9e7" stroke-width="3" stroke-linecap="round">
    <line x1="440" y1="640" x2="600" y2="640"/>
    <line x1="1000" y1="640" x2="1160" y2="640"/>
  </g>
  <circle cx="561" cy="640" r="8" fill="#cc9a45"/>
  <circle cx="1046" cy="640" r="8" fill="#cc9a45"/>

  <!-- cameras -->
  <g fill="#1d2125" stroke="#e8e9e7" stroke-width="3" stroke-linejoin="round">
    <path d="M470 700h100l-20 60h-60z"/>
    <path d="M1030 700h100l-20 60h-60z"/>
  </g>
  <circle cx="520" cy="700" r="6" fill="#e8e9e7"/>
  <circle cx="1080" cy="700" r="6" fill="#e8e9e7"/>

  <!-- baseline B -->
  <g stroke="#8a8e8b" stroke-width="2">
    <line x1="520" y1="810" x2="1080" y2="810"/>
    <line x1="520" y1="795" x2="520" y2="825"/>
    <line x1="1080" y1="795" x2="1080" y2="825"/>
  </g>

  <!-- depth Z, measured from the camera line to P -->
  <g stroke="#8a8e8b" stroke-width="2">
    <line x1="1240" y1="250" x2="1240" y2="700"/>
    <line x1="1225" y1="250" x2="1255" y2="250"/>
    <line x1="1225" y1="700" x2="1255" y2="700"/>
  </g>
  <line x1="872" y1="250" x2="1225" y2="250" stroke="#8a8e8b" stroke-width="1.5" stroke-dasharray="6 8"/>

  <!-- keypoint P -->
  <circle cx="830" cy="250" r="30" fill="none" stroke="#cc9a45" stroke-width="2" opacity="0.5"/>
  <circle cx="830" cy="250" r="12" fill="#cc9a45"/>

  <g font-family="ui-monospace, Consolas, monospace" fill="#e8e9e7">
    <text x="830" y="196" font-size="30" text-anchor="middle">P (x, y, z)</text>
    <text x="830" y="160" font-size="22" fill="#8a8e8b" text-anchor="middle">wrist keypoint</text>
    <text x="800" y="850" font-size="28" text-anchor="middle">B</text>
    <text x="1270" y="488" font-size="30">Z</text>
    <text x="520" y="610" font-size="22" fill="#8a8e8b" text-anchor="middle">x_L</text>
    <text x="1080" y="610" font-size="22" fill="#8a8e8b" text-anchor="middle">x_R</text>
    <text x="440" y="790" font-size="22" fill="#8a8e8b" text-anchor="end">cam L</text>
    <text x="1160" y="790" font-size="22" fill="#8a8e8b">cam R</text>
    <text x="100" y="130" font-size="34">Z = f · B / d</text>
    <text x="100" y="172" font-size="22" fill="#8a8e8b">d = x_L − x_R  (disparity, px)</text>
    <text x="100" y="870" font-size="20" fill="#5d6266">FIG. stereo triangulation, rectified pair</text>
  </g>
</svg>
